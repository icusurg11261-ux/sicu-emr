<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ SICU 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-4 text-primary">ระบบเวชระเบียน SICU 1</h4>
        <input type="email" id="email" class="form-control mb-3" placeholder="อีเมลเจ้าหน้าที่">
        <input type="password" id="password" class="form-control mb-3" placeholder="รหัสผ่าน">
        <button class="btn btn-primary w-100" onclick="signIn()">เข้าสู่ระบบ</button>
    </div>
    <script>
        // แก้ไขชื่อตัวแปรเป็น supabaseClient เพื่อหลีกเลี่ยงการชนกันของคำสั่ง
        const supabaseClient = window.supabase.createClient('https://aakyylpfusmwlsvksaim.supabase.co', 'sb_publishable_LjzvHRqLIDSE8OQhEHJPVw_Lb5XL9T8');
        
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                alert("กรุณากรอกอีเมลและรหัสผ่าน");
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
            } else {
                window.location.href = 'SICU_Logbook.html';
            }
        }
    </script>
</body>
</html>
